name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 10
    permissions: { contents: write, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Install pinned Bun and validate the Apple Silicon runner
        run: |
          set -euo pipefail
          npm install --global bun@1.3.5
          test "$(bun --version)" = 1.3.5
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 14
      - id: release-metadata
        name: Validate the annotated tag, test, and build Pages
        run: |
          set -euo pipefail
          TAG_OBJECT_TYPE="$(git cat-file -t "$GITHUB_REF")"
          if [ "$TAG_OBJECT_TYPE" != "tag" ]; then
            echo "::error title=Annotated tag required::Release tags must be annotated tag objects. Create one with: git tag -a vX.Y.Z -m vX.Y.Z" >&2
            exit 1
          fi
          SOURCE_COMMIT="$(git rev-parse "$GITHUB_REF^{commit}")"
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(bun -e 'import {parse} from "jsonc-parser"; console.log(parse(await Bun.file("registry.jsonc").text()).version)')" = "$VERSION"
          test "$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')" = "$VERSION"
          bun install --frozen-lockfile
          test "$(./node_modules/.bin/ocx --version)" = 2.0.15
          test "$(./node_modules/.bin/opencode --version)" = 1.18.27
          bun run typecheck
          bun run build
          REGISTRY_DIST=dist bun run test
          REGISTRY_DIST=dist bun run smoke
          bun -e 'const [version, tag, commit, path] = process.argv.slice(1); await Bun.write(path, `${JSON.stringify({ version, tag, commit })}\n`)' "$VERSION" "$GITHUB_REF_NAME" "$SOURCE_COMMIT" dist/release.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - id: release-policy
        name: Select the immutable release action
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          TARGET_VERSION: ${{ steps.release-metadata.outputs.version }}
          TARGET_COMMIT: ${{ steps.release-metadata.outputs.commit }}
        run: |
          set -euo pipefail
          LIVE_RELEASE="$RUNNER_TEMP/live-release.json"
          STATUS="$(curl --silent --show-error --output "$LIVE_RELEASE" --write-out '%{http_code}' "$BASE_URL/release.json")"
          case "$STATUS" in
            200) ACTION="$(bun run scripts/release-policy.ts "$LIVE_RELEASE" "$TARGET_VERSION" "$GITHUB_REF_NAME" "$TARGET_COMMIT")" ;;
            404) ACTION=deploy ;;
            *) echo "Unable to read the live release version (HTTP $STATUS)." >&2; exit 1 ;;
          esac
          case "$ACTION" in
            deploy) echo "should_deploy=true" >> "$GITHUB_OUTPUT" ;;
            noop)
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "Exact release $GITHUB_REF_NAME at $TARGET_COMMIT is already live; skipping deployment."
              ;;
            *) echo "Unknown release action: $ACTION" >&2; exit 1 ;;
          esac
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: steps.release-policy.outputs.should_deploy == 'true'
        with:
          name: github-pages
          path: dist
      - id: deploy-pages
        if: steps.release-policy.outputs.should_deploy == 'true'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        with:
          artifact_name: github-pages
      - name: Compare the live registry with dist
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            mkdir -p "$RUNNER_TEMP/live/$(dirname "$file")"
            curl --fail --retry 5 --retry-all-errors --retry-delay 2 --silent --show-error "$BASE_URL/$file" > "$RUNNER_TEMP/live/$file"
            cmp "dist/$file" "$RUNNER_TEMP/live/$file"
          done < <(cd dist && find . -type f -print | sed 's#^./##' | sort)
      - name: Create the GitHub Release when it does not already exist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_LOOKUP="$RUNNER_TEMP/github-release.json"
          STATUS="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --output "$RELEASE_LOOKUP" --write-out '%{http_code}' --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GITHUB_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          case "$STATUS" in
            200) echo "GitHub Release $GITHUB_REF_NAME already exists." ;;
            404) gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes ;;
            *) echo "Unable to look up GitHub Release $GITHUB_REF_NAME (HTTP $STATUS)." >&2; exit 1 ;;
          esac
