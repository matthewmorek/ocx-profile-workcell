name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 10
    permissions: { contents: write, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Install pinned Bun and validate the Apple Silicon runner
        run: |
          set -euo pipefail
          npm install --global bun@1.3.5
          test "$(bun --version)" = 1.3.5
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 14
      - name: Validate the annotated tag, test, and build Pages
        run: |
          set -euo pipefail
          TAG_OBJECT_TYPE="$(git cat-file -t "$GITHUB_REF")"
          if [ "$TAG_OBJECT_TYPE" != "tag" ]; then
            echo "::error title=Annotated tag required::Release tags must be annotated tag objects. Create one with: git tag -a vX.Y.Z -m vX.Y.Z" >&2
            exit 1
          fi
          SOURCE_COMMIT="$(git rev-parse "$GITHUB_REF^{commit}")"
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(bun -e 'import {parse} from "jsonc-parser"; console.log(parse(await Bun.file("registry.jsonc").text()).version)')" = "$VERSION"
          test "$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')" = "$VERSION"
          bun install --frozen-lockfile
          test "$(./node_modules/.bin/ocx --version)" = 2.0.14
          test "$(./node_modules/.bin/opencode --version)" = 1.18.27
          bun run typecheck
          bun run build
          REGISTRY_DIST=dist bun run test
          REGISTRY_DIST=dist bun run smoke
          bun -e 'const [version, tag, commit, path] = process.argv.slice(1); await Bun.write(path, `${JSON.stringify({ version, tag, commit })}\n`)' "$VERSION" "$GITHUB_REF_NAME" "$SOURCE_COMMIT" dist/release.json
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Reject a stale Pages version
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          LIVE_RELEASE="$RUNNER_TEMP/live-release.json"
          STATUS="$(curl --silent --show-error --output "$LIVE_RELEASE" --write-out '%{http_code}' "$BASE_URL/release.json")"
          case "$STATUS" in
            200) bun -e '
              const parse = (version) => {
                const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(version);
                if (!match) throw new Error(`Invalid SemVer: ${version}`);
                return { core: match.slice(1, 4).map(BigInt), prerelease: match[4]?.split(".") ?? [] };
              };
              const compareIdentifier = (left, right) => {
                const leftNumeric = /^\d+$/.test(left);
                const rightNumeric = /^\d+$/.test(right);
                if (leftNumeric && rightNumeric) return BigInt(left) === BigInt(right) ? 0 : BigInt(left) > BigInt(right) ? 1 : -1;
                if (leftNumeric !== rightNumeric) return leftNumeric ? -1 : 1;
                return left === right ? 0 : left > right ? 1 : -1;
              };
              const compare = (left, right) => {
                for (let index = 0; index < left.core.length; index += 1) if (left.core[index] !== right.core[index]) return left.core[index] > right.core[index] ? 1 : -1;
                if (!left.prerelease.length || !right.prerelease.length) return left.prerelease.length === right.prerelease.length ? 0 : left.prerelease.length ? -1 : 1;
                for (let index = 0; index < Math.min(left.prerelease.length, right.prerelease.length); index += 1) { const result = compareIdentifier(left.prerelease[index], right.prerelease[index]); if (result) return result; }
                return left.prerelease.length === right.prerelease.length ? 0 : left.prerelease.length > right.prerelease.length ? 1 : -1;
              };
              const live = JSON.parse(await Bun.file(process.argv[1]).text()).version;
              const target = process.argv[2];
              if (compare(parse(target), parse(live)) <= 0) throw new Error(`Target ${target} is not newer than live ${live}.`);
            ' "$LIVE_RELEASE" "${GITHUB_REF_NAME#v}" ;;
            404) ;;
            *) echo "Unable to read the live release version (HTTP $STATUS)." >&2; exit 1 ;;
          esac
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: github-pages
          path: dist
      - id: deploy-pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        with:
          artifact_name: github-pages
      - name: Compare the live registry with dist
        env:
          BASE_URL: ${{ steps.deploy-pages.outputs.page_url }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            mkdir -p "$RUNNER_TEMP/live/$(dirname "$file")"
            curl --fail --retry 5 --retry-all-errors --retry-delay 2 --silent --show-error "$BASE_URL/$file" > "$RUNNER_TEMP/live/$file"
            cmp "dist/$file" "$RUNNER_TEMP/live/$file"
          done < <(cd dist && find . -type f -print | sed 's#^./##' | sort)
      - name: Create the GitHub Release when it does not already exist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
