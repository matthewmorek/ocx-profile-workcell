name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  validate-pinned:
    runs-on: macos-14
    timeout-minutes: 8
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install pinned Bun and validate the Apple Silicon runner
        run: |
          set -euo pipefail
          npm install --global bun@1.3.5
          test "$(bun --version)" = 1.3.5
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 14
      - name: Typecheck, build, test, and smoke-test the Workcell registry
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          test "$(./node_modules/.bin/ocx --version)" = 2.0.14
          test "$(./node_modules/.bin/opencode --version)" = 1.18.27
          bun run typecheck
          bun run build
          REGISTRY_DIST=dist bun run test
          REGISTRY_DIST=dist bun run smoke
