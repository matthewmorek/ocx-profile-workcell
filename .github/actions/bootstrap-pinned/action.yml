name: bootstrap-pinned
description: Download and verify the pinned Apple Silicon release toolchain.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        test "$(uname -m)" = arm64
        test "$(sw_vers -productVersion | cut -d. -f1)" -ge 14
        /usr/bin/curl --version
        /usr/bin/shasum --version
        git --version
        unzip -v
        /bin/zsh --version
        sw_vers
        /usr/bin/curl -fsSL -o "$RUNNER_TEMP/bun.zip" https://github.com/oven-sh/bun/releases/download/bun-v1.3.5/bun-darwin-aarch64.zip
        echo "db17588a4aea8804856825d4bead3f05e1f37276ca606f37e369b4f72f35d3fb  $RUNNER_TEMP/bun.zip" | /usr/bin/shasum -a 256 -c -
        unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun"
        chmod +x "$RUNNER_TEMP/bun/bun-darwin-aarch64"
        /usr/bin/curl -fsSL -o "$RUNNER_TEMP/ocx" https://github.com/kdcokenny/ocx/releases/download/v2.0.14/ocx-darwin-arm64
        echo "1bdcb928da5d938fad787fc046e47068a87c8a2987466bba014294264efdc4b8  $RUNNER_TEMP/ocx" | /usr/bin/shasum -a 256 -c -
        chmod +x "$RUNNER_TEMP/ocx"
        /usr/bin/curl -fsSL -o "$RUNNER_TEMP/opencode.zip" https://github.com/anomalyco/opencode/releases/download/v1.17.15/opencode-darwin-arm64.zip
        echo "9667289c143d1fbdd440055af4041bb432f44b07ddf0aef048a8c7f2f7c65e2d  $RUNNER_TEMP/opencode.zip" | /usr/bin/shasum -a 256 -c -
        unzip -q "$RUNNER_TEMP/opencode.zip" -d "$RUNNER_TEMP/opencode"
        chmod +x "$RUNNER_TEMP/opencode/opencode"
        echo "$RUNNER_TEMP/bun/bun-darwin-aarch64" >> "$GITHUB_PATH"
        echo "BUN_BIN=$RUNNER_TEMP/bun/bun-darwin-aarch64" >> "$GITHUB_ENV"
        echo "OCX_BIN=$RUNNER_TEMP/ocx" >> "$GITHUB_ENV"
        echo "OPENCODE_BIN=$RUNNER_TEMP/opencode/opencode" >> "$GITHUB_ENV"
